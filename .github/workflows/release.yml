# Release pipeline — thin caller for entro314-labs/linux-release-kit.
# The tag is the trigger; the local half (release.config.json +
# @entro314labs/release-kit) writes the version, rolls the changelog, tags
# and pushes. See the kit README for the full contract.
#
# TODO once the kit repo is published: pin every kit reference below to a
# reviewed commit SHA (@<sha>) instead of @main — the workflows run with
# contents:write and the signing key.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true
        type: string
      build_targets:
        description: 'Retry lever: only build these legs (e.g. "linux-aarch64"). Empty = all.'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: entro314-labs/linux-release-kit/.github/workflows/release.yml@main
    permissions:
      contents: write
    with:
      app_display_name: 'Peek'
      product_name: 'magnetar-peek'
      tag: ${{ inputs.tag || '' }}
      build_targets: ${{ inputs.build_targets || '' }}
      # The justfile is the single source of truth for the installed layout:
      # build natively (the legs run on their own architecture), then stage
      # the full install tree for nfpm's tree entry to package.
      #
      # `just build-release` rather than a bare `cargo build --release`: the
      # recipe passes `--workspace`, and `install` copies two binaries. A
      # plain `cargo build` builds only the root package, so the leg compiled
      # for twelve minutes and then died on `install: cannot stat
      # 'target/release/peek-thumbnailer'`.
      build_command: |
        command -v just >/dev/null || { curl --proto '=https' --tlsv1.2 -sSfL https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin; }
        just build-release
        just rootdir="$PWD/.release-kit/pkgroot" install
      binary_path: 'target/release/$RK_BINARY'
      # Everything the build links, which is what ci.yml installs minus the
      # metadata validators. `libxkbcommon-dev` alone was not enough: the kit
      # runs a clippy gate before the build, and poppler, cairo and GStreamer
      # are all resolved through pkg-config at that point, so the leg died in
      # `gstreamer-sys`'s build script long before any lint ran.
      # `libunwind-dev` is named explicitly even though libgstreamer1.0-dev
      # depends on it: the ubuntu-22.04 runner image ships LLVM's
      # `libunwind-14-dev`, which conflicts with it rather than satisfying it,
      # and apt reports that as "held broken packages" against gstreamer
      # instead of against the thing actually in the way.
      apt_packages: >-
        pkg-config libunwind-dev
        libpoppler-glib-dev libcairo2-dev
        libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
        libxkbcommon-dev libwayland-dev libinput-dev libudev-dev
      # No AppImage yet: the apps ship SVG icons only and the AppImage leg
      # needs a 256x256 PNG (kit README, icon input). Add 'appimage' here
      # plus the PNG when wanted.
      formats: 'deb,rpm,arch'
    # Passed explicitly, NOT `secrets: inherit`: the kit lives in the
    # entro314-labs organisation and this repository in Magnetar-OS, and
    # `inherit` does not carry secrets across organisations — ARCH_REPO_TOKEN
    # arrived empty, so the pacman job staged, validated and then skipped the
    # push while still reporting success. Same fix as grabit's b1943aa.
    secrets:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
      LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}

  # Self-hosted pacman repository — Arch installs/updates via pacman -Syu,
  # shared across all entro314-labs apps.
  arch-repo:
    needs: release
    uses: entro314-labs/linux-release-kit/.github/workflows/arch-repo.yml@main
    with:
      tag: ${{ inputs.tag || '' }}
      product_name: 'magnetar-peek'
      repo_name: 'magnetar'
      pages_repo: 'Magnetar-OS/arch-repo'
    secrets:
      ARCH_REPO_TOKEN: ${{ secrets.ARCH_REPO_TOKEN }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
      LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}

  # AUR listing. Validates on every release; publishes only when the
  # AUR_SSH_PRIVATE_KEY secret is set (the AUR is not accepting submissions
  # at the time of wiring — this stays dormant until the key lands).
  aur:
    needs: release
    uses: entro314-labs/linux-release-kit/.github/workflows/aur.yml@main
    with:
      tag: ${{ inputs.tag || '' }}
      pkgname: 'magnetar-peek-bin'
      product_name: 'magnetar-peek'
      pkgdesc: 'Preview files without opening them'
      url: 'https://github.com/Magnetar-OS/peek'
      license: 'GPL-3.0-or-later'
      depends: 'libxkbcommon poppler-glib cairo glib2 gstreamer gst-plugins-base-libs xz'
      provides: 'magnetar-peek'
      conflicts: 'magnetar-peek'
      maintainer: 'Dominikos Pritis <dominikos.pritis@gmail.com>'
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
