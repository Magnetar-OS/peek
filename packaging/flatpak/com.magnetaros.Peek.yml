# Flatpak manifest.
#
# A previewer is an unusual thing to sandbox, and the permissions below are
# the honest consequence of what it does rather than a copied boilerplate:
#
#   * It maps a `wlr-layer-shell` surface, which the portal has no equivalent
#     for — `--socket=wayland` plus the layer-shell protocol is the only way an
#     overlay above the panel exists at all.
#   * It is pointed at whatever file the user selected, from a file manager
#     running outside the sandbox. A document portal handle would work for a
#     file the user picked in a dialog; a previewer never opens a dialog. So it
#     reads the host filesystem, read-only.
#   * It serves `org.gnome.NautilusPreviewer2` so the space bar reaches it.
#
# Nothing here is write access: `peek` renders files and never modifies them,
# which is the one property that makes read-only host access defensible.
app-id: com.magnetaros.Peek
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: magnetar-peek

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/peek/cargo

finish-args:
  - --socket=wayland
  # Video and audio previews play through GStreamer.
  - --socket=pulseaudio
  # wgpu needs the GPU; the overlay uploads a video frame per displayed frame.
  - --device=dri
  # Read-only, and the reason is above.
  - --filesystem=host:ro
  # The previewer interface the file manager calls, and the name peek owns.
  - --own-name=org.gnome.NautilusPreviewer
  - --own-name=com.magnetaros.Peek
  # Opening a file in its real application has to leave the sandbox.
  - --talk-name=org.freedesktop.portal.OpenURI
  # Settings live in cosmic-config, which is read through the session bus.
  - --talk-name=com.system76.CosmicSettingsDaemon

# What poppler installs for building against it. Nothing at run time reads a
# header, a pkg-config file or introspection data.
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /lib/girepository-1.0
  - /share/gir-1.0

modules:
  - name: poppler-data
    # The encoding tables poppler reads at run time. Without them a PDF in a
    # CJK encoding renders with its text missing; every distribution's
    # poppler package depends on this for the same reason.
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        # Computed from the release tarball downloaded on 2026-09-30.
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74

  - name: poppler
    # The PDF renderer. Not in the freedesktop runtime, and the reason the
    # whole workspace is GPL — see the workspace manifest.
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_GLIB=ON
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_BOOST=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DENABLE_UTILS=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.08.0.tar.xz
        # Computed from the release tarball downloaded on 2026-09-29.
        sha256: dc906e68cea698109706ac6aa3d2c9d4512fcfcac42d90b8afcda486d1b9abd0

  - name: peek
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      # `--ignore-rust-version`: the workspace asks for the compiler its own
      # toolchain file pins, and the SDK's rust-stable extension can be a
      # patch release behind it — 1.98.0 against 1.98.1 when this was first
      # built. A patch release adds no language features, so the build is the
      # same; without the flag cargo refuses to start.
      - cargo --offline build --release --workspace --ignore-rust-version
      - install -Dm0755 target/release/magnetar-peek /app/bin/magnetar-peek
      - install -Dm0755 target/release/peek-thumbnailer /app/bin/peek-thumbnailer
      - install -Dm0644 res/com.magnetaros.Peek.desktop /app/share/applications/com.magnetaros.Peek.desktop
      - install -Dm0644 res/com.magnetaros.Peek.metainfo.xml /app/share/metainfo/com.magnetaros.Peek.metainfo.xml
      - install -Dm0644 res/com.magnetaros.Peek.thumbnailer /app/share/thumbnailers/com.magnetaros.Peek.thumbnailer
      - install -Dm0644 res/icons/hicolor/scalable/apps/com.magnetaros.Peek.svg /app/share/icons/hicolor/scalable/apps/com.magnetaros.Peek.svg
      - install -Dm0644 res/icons/hicolor/symbolic/apps/com.magnetaros.Peek-symbolic.svg /app/share/icons/hicolor/symbolic/apps/com.magnetaros.Peek-symbolic.svg
      - for size in 16x16 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do install -Dm0644 "res/icons/hicolor/$size/apps/com.magnetaros.Peek.png" "/app/share/icons/hicolor/$size/apps/com.magnetaros.Peek.png"; done
      - install -Dm0644 res/man/magnetar-peek.1 /app/share/man/man1/magnetar-peek.1
      - install -Dm0644 res/man/peek-thumbnailer.1 /app/share/man/man1/peek-thumbnailer.1
      - install -Dm0644 res/plugins/README.md /app/share/peek/plugins/README.md
      - install -Dm0644 res/plugins/com.magnetaros.Peek.example-command.toml /app/share/peek/plugins/com.magnetaros.Peek.example-command.toml.example
      - install -Dm0644 res/plugins/com.magnetaros.Peek.example-text.toml /app/share/peek/plugins/com.magnetaros.Peek.example-text.toml.example
    sources:
      - type: dir
        path: ../..
        # A `dir` source copies the whole checkout into the build. Without
        # this it takes the cargo target directory with it — tens of
        # gigabytes — and, when flatpak-builder is run from this directory as
        # the README says, its own state and build directories, recursively.
        skip:
          - target
          - .git
          - .release-kit
          - packaging/flatpak/.flatpak-builder
          - packaging/flatpak/build
      # Generated from Cargo.lock by `just flatpak-sources`; not checked in
      # because it is generated and enormous. See README.md beside this file.
      - generated-sources.json
