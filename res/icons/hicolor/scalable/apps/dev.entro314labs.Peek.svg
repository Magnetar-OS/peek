<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    A sheet with one corner turned, and the preview overlay sitting on top of
    it — which is literally what the application does: it puts a panel over the
    file rather than opening the file. The turned corner reads as "document" at
    16px, where the overlay is the only other shape that survives.
  -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F6F7"/>
      <stop offset="1" stop-color="#D3DDE0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FA8A0"/>
      <stop offset="1" stop-color="#177C7A"/>
    </linearGradient>
  </defs>

  <!-- The document -->
  <path d="M26 12h46l30 30v62a8 8 0 0 1-8 8H26a8 8 0 0 1-8-8V20a8 8 0 0 1 8-8z"
        fill="url(#sheet)"/>
  <!-- The turned corner -->
  <path d="M72 12l30 30H80a8 8 0 0 1-8-8z" fill="#A9BABE"/>

  <!-- The overlay panel, offset so it reads as sitting above the sheet -->
  <rect x="40" y="56" width="74" height="52" rx="10" fill="url(#panel)"/>
  <!-- Content lines inside the panel -->
  <rect x="52" y="70" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.92"/>
  <rect x="52" y="84" width="34" height="6" rx="3" fill="#FFFFFF" opacity="0.62"/>
</svg>
